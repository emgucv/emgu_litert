# Builds the native libraries (libLiteRt + libtfliteextern) with the current platform build scripts on
# GitHub-hosted runners, and uploads them as artifacts.
#
# Submodules (litert, LiteRT-LM) are checked out non-recursively, so not litert's nested third_party/tensorflow
# submodule: LiteRT's Bazel WORKSPACE downloads its own pinned TensorFlow archive. Builds start from a cold Bazel
# cache, so each job is long (GitHub-hosted jobs are limited to 6 hours).
name: Native builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    # The libraries need a glibc at least as new as the one they were built against, so these load on Ubuntu 26.04
    # and newer, not on 24.04.
    name: Ubuntu 26.04 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          runner: ubuntu-26.04
          prebuilt: linux_x86_64
        - arch: arm64
          runner: ubuntu-26.04-arm
          prebuilt: linux_arm64
    steps:
    - name: Free disk space
      # Standard runners have ~14 GB free on /; a cold LiteRT Bazel build needs more. Remove large preinstalled
      # toolchains this job doesn't use.
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /usr/local/share/boost /opt/hostedtoolcache/CodeQL
        df -h /
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install clang
      # The build script compiles with clang when it's installed; Ubuntu 26.04's GCC rejects some LiteRT sources.
      run: command -v clang++ || (sudo apt-get update && sudo apt-get install -y clang)
    - name: Fetch LiteRT-LM's prebuilt Gemma library
      # liblitert-lm.so depends on prebuilt/linux_<arch>/libGemmaModelConstraintProvider.so, which LiteRT-LM stores
      # with Git LFS; the submodule checkout only has its pointer file.
      run: git -C LiteRT-LM lfs pull --include=prebuilt/${{ matrix.prebuilt }}/libGemmaModelConstraintProvider.so
    - name: Build libLiteRt.so, libtfliteextern.so and liblitert-lm.so
      # The script detects the host architecture (x86_64 or aarch64) and picks the Bazel configs and output folder.
      # The runner's ANDROID_* variables point at the SDK the "Free disk space" step removed; litert's WORKSPACE
      # sets up an Android SDK repository from them and fails if it's missing, so hide them from this build.
      run: |
        env -u ANDROID_HOME -u ANDROID_SDK_ROOT -u ANDROID_NDK -u ANDROID_NDK_HOME -u ANDROID_NDK_ROOT \
          -u ANDROID_NDK_LATEST_HOME platforms/ubuntu/26.04/bazel_build_tflite
    - uses: actions/upload-artifact@v7
      with:
        name: native-ubuntu-${{ matrix.arch }}
        path: lib/runtimes/ubuntu-${{ matrix.arch }}/native/
        if-no-files-found: error

  android:
    name: Android ${{ matrix.arch }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: arm64
          abi: arm64-v8a
        - arch: x86_64
          abi: x86_64
    steps:
    - name: Free disk space
      # Keep /usr/local/lib/android: the Android SDK and NDK this job builds with live there.
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
          /opt/hostedtoolcache/CodeQL
        df -h /
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install clang
      # The build script compiles the host-side build tools with clang when it's installed; Ubuntu 26.04's GCC rejects
      # some of their sources (e.g. Abseil's raw_hash_set.cc).
      run: command -v clang++ || (sudo apt-get update && sudo apt-get install -y clang)
    - name: Select the Android NDK
      # The build is verified with NDK 28; prefer a preinstalled 28.x, else the newest preinstalled NDK.
      run: |
        NDK=$(ls "$ANDROID_HOME/ndk" | grep '^28\.' | sort -V | tail -1)
        [ -z "$NDK" ] && NDK=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK" >> "$GITHUB_ENV"
        echo "Using NDK $NDK"
    - name: Fetch LiteRT-LM's prebuilt libraries
      # liblitert-lm.so depends on prebuilt/android_<arch>/libGemmaModelConstraintProvider.so, and the build also
      # copies LiteRT's GPU (OpenCL) accelerator, libLiteRtOpenClAccelerator.so; LiteRT-LM stores both with Git LFS,
      # and the submodule checkout only has their pointer files.
      run: >
        git -C LiteRT-LM lfs pull
        --include=prebuilt/android_${{ matrix.arch }}/libGemmaModelConstraintProvider.so,prebuilt/android_${{ matrix.arch }}/libLiteRtOpenClAccelerator.so
    - name: Build libLiteRt.so, libtfliteextern.so and liblitert-lm.so
      run: platforms/android/bazel_build_tflite_android ${{ matrix.arch }}
    - uses: actions/upload-artifact@v7
      with:
        name: native-android-${{ matrix.abi }}
        path: lib/android/${{ matrix.abi }}/
        if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Fetch LiteRT-LM's prebuilt libraries
      # liblitert-lm.dylib depends on prebuilt/macos_arm64/libGemmaModelConstraintProvider.dylib, and the build also
      # copies LiteRT's GPU (Metal) accelerator, libLiteRtMetalAccelerator.dylib; LiteRT-LM stores both with Git LFS,
      # and the submodule checkout only has their pointer files.
      run: >
        git -C LiteRT-LM lfs pull
        --include=prebuilt/macos_arm64/libGemmaModelConstraintProvider.dylib,prebuilt/macos_arm64/libLiteRtMetalAccelerator.dylib
    - name: Build universal libLiteRt.dylib and libtfliteextern.dylib, and arm64 liblitert-lm.dylib
      run: platforms/macos/bazel_build_tflite_macos_fat
    - uses: actions/upload-artifact@v7
      with:
        name: native-macos-universal
        path: |
          lib/runtimes/osx/native/libLiteRt.dylib
          lib/runtimes/osx/native/libtfliteextern.dylib
          lib/runtimes/osx/native/liblitert-lm.dylib
          lib/runtimes/osx/native/libGemmaModelConstraintProvider.dylib
          lib/runtimes/osx/native/libLiteRtMetalAccelerator.dylib
        if-no-files-found: error

  ios:
    # Builds the iOS frameworks (device arm64 + simulator arm64), then the MAUI demo for the iOS simulator with them, and
    # checks that the app bundle embeds all four. A simulator build needs no signing; the device slices are built and
    # uploaded but not linked into an app here.
    name: iOS frameworks and MAUI demo
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Fetch LiteRT-LM's prebuilt Gemma libraries
      # LiteRtLm.framework links prebuilt/ios_{arm64,sim_arm64}/libGemmaModelConstraintProvider.dylib, which LiteRT-LM
      # stores with Git LFS; the submodule checkout only has their pointer files.
      run: >
        git -C LiteRT-LM lfs pull
        --include=prebuilt/ios_arm64/libGemmaModelConstraintProvider.dylib,prebuilt/ios_sim_arm64/libGemmaModelConstraintProvider.dylib
    - name: Build LiteRt.xcframework and tfliteextern.xcframework
      run: platforms/ios/bazel_build_tflite_ios_frameworks
    - name: Build LiteRtLm.xcframework and GemmaModelConstraintProvider.xcframework
      run: platforms/ios/bazel_build_litert_lm_ios
    - uses: actions/upload-artifact@v7
      with:
        name: native-ios
        path: |
          lib/ios/LiteRt.xcframework
          lib/ios/tfliteextern.xcframework
          lib/ios/LiteRtLm.xcframework
          lib/ios/GemmaModelConstraintProvider.xcframework
          lib/ios/tflite_version.txt
        if-no-files-found: error
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install the .NET MAUI workloads
      # All of them, not just maui-ios: restoring the demo restores every target framework it has on macOS (Android,
      # iOS, Mac Catalyst), even when building one.
      run: dotnet workload install maui
    - name: Generate the projects' Directory.Build.props
      # The projects take their target framework and package settings from files CMake generates.
      run: cmake -S . -B build
    - name: Build the MAUI demo for the iOS simulator
      # ValidateXcodeVersion=false: the runner's Xcode needn't be the exact version the .NET iOS SDK pack names.
      run: >
        dotnet build Emgu.LiteRT.Example/Maui.Lite/Maui.Demo.Lite.csproj -f net10.0-ios -c Debug
        -p:RuntimeIdentifier=iossimulator-arm64 -p:ValidateXcodeVersion=false
    - name: Check the app bundle's frameworks
      # Each framework must be embedded, be a simulator binary, and find the frameworks it links in the app's
      # Frameworks folder.
      run: |
        APP=$(ls -d Emgu.LiteRT.Example/Maui.Lite/bin/Debug/net10.0-ios/iossimulator-arm64/*.app)
        echo "$APP"
        ls "$APP/Frameworks"
        for NAME in LiteRt tfliteextern LiteRtLm GemmaModelConstraintProvider; do
          BIN="$APP/Frameworks/$NAME.framework/$NAME"
          [ -f "$BIN" ] || { echo "::error::$NAME.framework is missing from the app"; exit 1; }
          vtool -show-build "$BIN" | grep -q "platform IOSSIMULATOR" || { echo "::error::$NAME is not an iOS simulator binary"; exit 1; }
          for DEP in $(otool -L "$BIN" | awk '/@rpath\/.*\.framework/ {print $1}'); do
            DEP_NAME=$(basename "$DEP")
            [ "$DEP_NAME" = "$NAME" ] && continue
            [ -f "$APP/Frameworks/$DEP_NAME.framework/$DEP_NAME" ] || { echo "::error::$NAME links $DEP, which the app doesn't embed"; exit 1; }
          done
        done

  windows:
    # Builds tfliteextern.dll, libLiteRt.dll and liblitert-lm.dll with platforms/windows/bazel_build_litert.ps1, then runs
    # the whole test suite against them, including the "Native" tests the model-free Tests workflow skips (the model
    # tests stay ignored without -p:TestModels=true).
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      # The script uses Python 3.12 for Bazel's hermetic Python only when it finds one in C:\Python312; the runner's
      # comes from setup-python instead.
      HERMETIC_PYTHON_VERSION: "3.12"
      # Bazel runs genrules and shell actions with this bash.
      BAZEL_SH: C:\msys64\usr\bin\bash.exe
    steps:
    - name: Show free disk space
      run: Get-PSDrive -PSProvider FileSystem
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Download Bazelisk
      # The bazel.exe on the runner's PATH ran Bazel 9.x (which no longer reads WORKSPACE files) whatever
      # USE_BAZEL_VERSION or LiteRT-LM's .bazelversion said, so the script is given its own Bazelisk, which runs the
      # version in LiteRT-LM's .bazelversion (the script builds from that folder).
      run: |
        New-Item -ItemType Directory -Force D:\bazelisk | Out-Null
        Invoke-WebRequest "https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-windows-amd64.exe" -OutFile D:\bazelisk\bazel.exe
        "BAZEL_COMMAND=D:\bazelisk\bazel.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        cd LiteRT-LM
        & D:\bazelisk\bazel.exe --version
    - name: Fetch LiteRT-LM's prebuilt Gemma library
      # liblitert-lm.dll depends on prebuilt/windows_x86_64/libGemmaModelConstraintProvider.dll, which LiteRT-LM stores
      # with Git LFS; without it the script skips liblitert-lm.dll.
      run: git -C LiteRT-LM lfs pull --include=prebuilt/windows_x86_64/libGemmaModelConstraintProvider.dll
    - name: Build tfliteextern.dll, libLiteRt.dll and liblitert-lm.dll
      # Run from a drive letter mapped to the workspace: the LiteRT-LM build's Rust objects come within a few characters
      # of link.exe's 260-character path limit even under the repo root's short "o"/"u" output folders (see the script).
      run: |
        subst X: "$env:GITHUB_WORKSPACE"
        X:
        powershell -NoProfile -ExecutionPolicy Bypass -File X:\platforms\windows\bazel_build_litert.ps1 64
    - name: Check the built libraries
      # The script doesn't stop at a failed Bazel build, so check that every library was written.
      run: |
        $missing = @("tfliteextern.dll", "libLiteRt.dll", "liblitert-lm.dll", "libGemmaModelConstraintProvider.dll", "tflite_version.txt") |
          Where-Object { -not (Test-Path "lib\runtimes\win-x64\native\$_") }
        Get-ChildItem lib\runtimes\win-x64\native
        if ($missing) { Write-Error "Missing: $($missing -join ', ')"; exit 1 }
    - uses: actions/upload-artifact@v7
      with:
        name: native-windows-x64
        path: |
          lib/runtimes/win-x64/native/tfliteextern.dll
          lib/runtimes/win-x64/native/libLiteRt.dll
          lib/runtimes/win-x64/native/liblitert-lm.dll
          lib/runtimes/win-x64/native/libGemmaModelConstraintProvider.dll
          lib/runtimes/win-x64/native/tflite_version.txt
        if-no-files-found: error
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Generate the projects' Directory.Build.props
      run: cmake -S . -B build
    - name: Run the tests
      run: >
        dotnet test Emgu.LiteRT.Test/Emgu.TF.Lite.Test/Emgu.TF.Lite.Test.Net/Emgu.TF.Lite.Test.Net.csproj
        --logger "trx;LogFileName=tests.trx" --results-directory test-results
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: test-results-windows
        path: test-results/
