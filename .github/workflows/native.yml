# Builds the native libraries (libLiteRt + libtfliteextern) with the current platform build scripts on
# GitHub-hosted runners, and uploads them as artifacts.
#
# Submodules (litert, LiteRT-LM) are checked out non-recursively, so not litert's nested third_party/tensorflow
# submodule: LiteRT's Bazel WORKSPACE downloads its own pinned TensorFlow archive. Builds start from a cold Bazel
# cache, so each job is long (GitHub-hosted jobs are limited to 6 hours).
name: Native builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    # The libraries need a glibc at least as new as the one they were built against, so these load on Ubuntu 26.04
    # and newer, not on 24.04.
    name: Ubuntu 26.04 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          runner: ubuntu-26.04
        - arch: arm64
          runner: ubuntu-26.04-arm
    steps:
    - name: Free disk space
      # Standard runners have ~14 GB free on /; a cold LiteRT Bazel build needs more. Remove large preinstalled
      # toolchains this job doesn't use.
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /usr/local/share/boost /opt/hostedtoolcache/CodeQL
        df -h /
    - uses: actions/checkout@v5
      with:
        submodules: true
    - name: Install clang
      # The build script compiles with clang when it's installed; Ubuntu 26.04's GCC rejects some LiteRT sources.
      run: command -v clang++ || (sudo apt-get update && sudo apt-get install -y clang)
    - name: Build libLiteRt.so and libtfliteextern.so
      # The script detects the host architecture (x86_64 or aarch64) and picks the Bazel configs and output folder.
      # The runner's ANDROID_* variables point at the SDK the "Free disk space" step removed; litert's WORKSPACE
      # sets up an Android SDK repository from them and fails if it's missing, so hide them from this build.
      run: |
        env -u ANDROID_HOME -u ANDROID_SDK_ROOT -u ANDROID_NDK -u ANDROID_NDK_HOME -u ANDROID_NDK_ROOT \
          -u ANDROID_NDK_LATEST_HOME platforms/ubuntu/26.04/bazel_build_tflite
    - uses: actions/upload-artifact@v5
      with:
        name: native-ubuntu-${{ matrix.arch }}
        path: lib/runtimes/ubuntu-${{ matrix.arch }}/native/
        if-no-files-found: error

  android:
    name: Android ${{ matrix.arch }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: arm64
          abi: arm64-v8a
        - arch: x86_64
          abi: x86_64
    steps:
    - name: Free disk space
      # Keep /usr/local/lib/android: the Android SDK and NDK this job builds with live there.
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
          /opt/hostedtoolcache/CodeQL
        df -h /
    - uses: actions/checkout@v5
      with:
        submodules: true
    - name: Install clang
      # The build script compiles the host-side build tools with clang when it's installed; Ubuntu 26.04's GCC rejects
      # some of their sources (e.g. Abseil's raw_hash_set.cc).
      run: command -v clang++ || (sudo apt-get update && sudo apt-get install -y clang)
    - name: Select the Android NDK
      # The build is verified with NDK 28; prefer a preinstalled 28.x, else the newest preinstalled NDK.
      run: |
        NDK=$(ls "$ANDROID_HOME/ndk" | grep '^28\.' | sort -V | tail -1)
        [ -z "$NDK" ] && NDK=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK" >> "$GITHUB_ENV"
        echo "Using NDK $NDK"
    - name: Fetch LiteRT-LM's prebuilt Gemma library
      # liblitert-lm.so depends on prebuilt/android_<arch>/libGemmaModelConstraintProvider.so, which LiteRT-LM
      # stores with Git LFS; the submodule checkout only has its pointer file.
      run: git -C LiteRT-LM lfs pull --include=prebuilt/android_${{ matrix.arch }}/libGemmaModelConstraintProvider.so
    - name: Build libLiteRt.so, libtfliteextern.so and liblitert-lm.so
      run: platforms/android/bazel_build_tflite_android ${{ matrix.arch }}
    - uses: actions/upload-artifact@v5
      with:
        name: native-android-${{ matrix.abi }}
        path: lib/android/${{ matrix.abi }}/
        if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true
    - name: Fetch LiteRT-LM's prebuilt Gemma library
      # liblitert-lm.dylib depends on prebuilt/macos_arm64/libGemmaModelConstraintProvider.dylib, which LiteRT-LM
      # stores with Git LFS; the submodule checkout only has its pointer file.
      run: git -C LiteRT-LM lfs pull --include=prebuilt/macos_arm64/libGemmaModelConstraintProvider.dylib
    - name: Build universal libLiteRt.dylib and libtfliteextern.dylib, and arm64 liblitert-lm.dylib
      run: platforms/macos/bazel_build_tflite_macos_fat
    - uses: actions/upload-artifact@v5
      with:
        name: native-macos-universal
        path: |
          lib/runtimes/osx/native/libLiteRt.dylib
          lib/runtimes/osx/native/libtfliteextern.dylib
          lib/runtimes/osx/native/liblitert-lm.dylib
          lib/runtimes/osx/native/libGemmaModelConstraintProvider.dylib
        if-no-files-found: error
